################################################################################
## Constraints

# Restrict graph to first versions of workflows only
versions: ['1']

# Set the number of crates to process (0 for all)
max-workflow-id: '20'

################################################################################
## Paths

# Directory for workflow outputs
output-dir: "output"

# Directory for metadata generated by the workflow run
run-metadata: "run-metadata"
  
################################################################################
# Filenames

# List of sourced RO Crates
sourced-list: "manifest.json"
  
# List of validated RO Crate manifests
validated-list: "valid-rocrate-list.json"

# The base graph (prior to enrichments)
base-graph: "workflowhub-graph-base.ttl"

# The final merged graph (with enrichments)
output-graph: "workflowhub-graph.ttl"

################################################################################
## Enrichment options

# Enrichment strategies to apply to the graph
enrichment-strategies: ["consolidate-workflow-languages"]

# Directory for enrichment outputs
enrichment-output-dir: "graph-enrichments"


